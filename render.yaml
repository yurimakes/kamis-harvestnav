services:
  - type: web
    name: kamis-harvestnav
    runtime: python
    plan: free
    region: singapore
    autoDeployTrigger: "off"
    buildCommand: bash scripts/render-build.sh
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: NODE_VERSION
        value: 24.22.1
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATA_GO_KR_SERVICE_KEY
        sync: false
